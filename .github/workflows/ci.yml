name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Tip, lint ve testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  budget:
    name: Performans ve erişilebilirlik bütçesi
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Üretim sunucusunu başlat
        run: |
          npx next start -p 3100 &
          npx wait-on http://localhost:3100/api/health --timeout 60000
      - name: Sağlık ucu yanıt veriyor mu
        run: curl -fsS http://localhost:3100/api/health > /dev/null
      # Bütçe aşılırsa sıfırdan farklı kodla çıkar ve birleştirmeyi durdurur.
      - run: npm run budget -- http://localhost:3100
